<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Page introuvable — Les Dés'Calés</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #E31507;
      --red-dark: #B80F05;
      --yellow: #FFE698;
      --yellow-pale: #FFF9E0;
      --orange: #FF8A00;
      --gray-dark: #333333;
      --gray-mid: #666666;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--yellow);
      color: var(--gray-dark);
      font-family: Sniglet, "Comic Sans MS", cursive, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    .card {
      width: 100%;
      max-width: 34rem;
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 2.5rem 2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    .die { width: 84px; height: 84px; }
    /* ponytail: le dé tourne une fois au chargement, pas de boucle */
    @media (prefers-reduced-motion: no-preference) {
      .die { animation: roll 700ms ease-out; }
      @keyframes roll {
        from { transform: rotate(-25deg) scale(0.85); opacity: 0; }
        to   { transform: rotate(0) scale(1); opacity: 1; }
      }
    }
    h1 {
      margin: 0;
      font-family: Antonio, Impact, sans-serif;
      font-weight: 700;
      font-size: clamp(2.25rem, 8vw, 3rem);
      line-height: 1.05;
      color: var(--red);
      text-wrap: balance;
    }
    .code {
      font-family: Antonio, Impact, sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gray-mid);
    }
    p { margin: 0; max-width: 32ch; color: var(--gray-dark); }
    .links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    a {
      font-family: Antonio, Impact, sans-serif;
      font-weight: 500;
      font-size: 1rem;
      text-decoration: none;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      border: 2px solid var(--red);
      transition: background-color 150ms, color 150ms;
    }
    a:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
    .primary { background: var(--red); color: #FFFFFF; }
    .primary:hover { background: var(--red-dark); border-color: var(--red-dark); }
    .secondary { background: transparent; color: var(--red); }
    .secondary:hover { background: var(--yellow-pale); }
    .more { font-size: 0.9rem; color: var(--gray-mid); }
    .more a {
      all: unset;
      color: var(--gray-mid);
      text-decoration: underline;
      cursor: pointer;
    }
    .more a:hover { color: var(--red); }
    .more a:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <svg class="die" viewBox="0 0 100 100" role="img" aria-label="Un dé">
      <rect x="6" y="6" width="88" height="88" rx="18" fill="#FFF9E0" stroke="#E31507" stroke-width="5"/>
      <circle cx="30" cy="30" r="8" fill="#E31507"/>
      <circle cx="70" cy="30" r="8" fill="#E31507"/>
      <circle cx="30" cy="70" r="8" fill="#E31507"/>
      <circle cx="70" cy="70" r="8" fill="#FF8A00"/>
    </svg>

    <p class="code">Erreur 404</p>
    <h1>Cette page a quitté la table</h1>
    <p>Elle a été déplacée, renommée, ou n'a jamais existé. Ça arrive même aux meilleurs joueurs.</p>

    <div class="links">
      <a class="primary" href="/">Retour à l'accueil</a>
      <a class="secondary" href="/contact">Nous contacter</a>
    </div>

    <p class="more">
      Vous cherchiez peut-être
      <a href="/animations">nos animations</a>,
      <a href="/festival">le festival</a>
      ou <a href="/galeries-photos">les galeries photos</a>.
    </p>
  </main>
</body>
</html>
